[mypy]
explicit_package_bases = true
namespace_packages = true

[mypy-app.models.*]
# SQLAlchemy relationship() string forward refs (Mapped["User"], relationship("User", ...))
# are resolved by the ORM registry at runtime, not by Python's name resolution — ruff's
# per-file F821 ignore for this same directory documents the same reasoning.
disable_error_code = name-defined
