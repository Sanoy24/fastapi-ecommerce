[mypy]
plugins = pydantic.mypy
explicit_package_bases = true
namespace_packages = true

[mypy-app.models.*]
# SQLAlchemy relationship() string forward refs (Mapped["User"], relationship("User", ...))
# are resolved by the ORM registry at runtime, not by Python's name resolution — ruff's
# per-file F821 ignore for this same directory documents the same reasoning.
# no-redef: the @x.expression decorator on hybrid_property legitimately redefines the
# instance-level method with a class-level SQL-expression version — mypy doesn't model
# this SQLAlchemy idiom, but it is a standard, safe pattern (see product.py).
disable_error_code = name-defined, no-redef

[mypy-logging_loki.*]
ignore_missing_imports = true
