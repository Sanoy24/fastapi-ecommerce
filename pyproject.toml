[project]
name = "fastapi-ecommerce"
version = "1.0.0"
description = "A scalable and modular eCommerce REST API built with FastAPI, SQLAlchemy, and JWT authentication."
authors = [
    {name = "Yonas Mekonnen",email = "myonas886@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "fastapi[standard] (>=0.141.0,<0.142.0)",
    "sqlalchemy (>=2.0.44,<3.0.0)",
    "pydantic (>=2.12.4,<3.0.0)",
    "pydantic-settings (>=2.12.0,<3.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "alembic (>=1.17.2,<2.0.0)",
    "passlib (>=1.7.4,<2.0.0)",
    "python-multipart (>=0.0.31,<0.0.32)",
    "stripe (>=14.0.1,<15.0.0)",
    "loguru (>=0.7.3,<0.8.0)",
    "slugify (>=0.0.1,<0.0.2)",
    "pwdlib[argon2] (>=0.3.0,<0.4.0)",
    "pyjwt (>=2.10.1,<3.0.0)",
    "redis (<5.4.0)",
    "elasticsearch (>=8.11.0,<9.0.0)",
    "aiohttp (>=3.13.2,<4.0.0)",
    "opentelemetry-sdk (>=1.38.0,<2.0.0)",
    "opentelemetry-instrumentation-fastapi (>=0.59b0,<0.60)",
    "opentelemetry-instrumentation-logging (>=0.59b0,<0.60)",
    "opentelemetry-exporter-otlp (>=1.38.0,<2.0.0)",
    "opentelemetry-instrumentation-sqlalchemy (>=0.59b0,<0.60)",
    "python-logging-loki (>=0.3.1,<0.4.0)",
    "prometheus-fastapi-instrumentator (>=8.1.0,<9.0.0)",
    "fastapi-cache2 (>=0.2.2,<0.3.0)",
    "arq (>=0.28.0,<0.29.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)",
    "boto3 (>=1.43.80,<2.0.0)",
    "pyotp (>=2.10.0,<3.0.0)",
    "slowapi (>=0.1.10,<0.2.0)",
    "aiosmtplib (>=5.1.2,<6.0.0)",
    "urllib3 (>=2.7.0,<3.0.0)",
    "requests (>=2.33.0,<3.0.0)",
    "starlette (>=1.3.1,<2.0.0)",
    "click (>=8.3.3,<9.0.0)"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.14.7,<0.15.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "testcontainers (>=4.15.0,<5.0.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)",
    "mypy (>=2.3.1,<3.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)"
]

[tool.ruff]
line-length = 160

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "F821",  # SQLAlchemy Mapped["X"] string annotations are valid forward refs — false positives in models/
]

[tool.ruff.lint.per-file-ignores]
"app/models/*.py" = ["F821"]   # SQLAlchemy relationship string refs are not real undefined names
"app/models/__init__.py" = ["F401"]  # Re-exports for Alembic model discovery are intentional
