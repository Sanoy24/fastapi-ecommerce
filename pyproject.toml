[project]
name = "fastapi-ecommerce"
version = "1.0.0"
description = "A scalable and modular eCommerce REST API built with FastAPI, SQLAlchemy, and JWT authentication."
authors = [
    {name = "Yonas Mekonnen",email = "myonas886@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "fastapi[standard] (>=0.121.3,<0.122.0)",
    "sqlalchemy (>=2.0.44,<3.0.0)",
    "pydantic (>=2.12.4,<3.0.0)",
    "pydantic-settings (>=2.12.0,<3.0.0)",
    "python-dotenv (>=1.2.1,<2.0.0)",
    "alembic (>=1.17.2,<2.0.0)",
    "passlib (>=1.7.4,<2.0.0)",
    "python-multipart (>=0.0.20,<0.0.21)",
    "stripe (>=14.0.1,<15.0.0)",
    "loguru (>=0.7.3,<0.8.0)",
    "slugify (>=0.0.1,<0.0.2)",
    "pwdlib[argon2] (>=0.3.0,<0.4.0)",
    "pyjwt (>=2.10.1,<3.0.0)",
    "redis (<5.4.0)",
    "elasticsearch (>=8.11.0,<9.0.0)",
    "aiohttp (>=3.13.2,<4.0.0)",
    "opentelemetry-sdk (>=1.38.0,<2.0.0)",
    "opentelemetry-instrumentation-fastapi (>=0.59b0,<0.60)",
    "opentelemetry-instrumentation-logging (>=0.59b0,<0.60)",
    "opentelemetry-exporter-otlp (>=1.38.0,<2.0.0)",
    "opentelemetry-instrumentation-sqlalchemy (>=0.59b0,<0.60)",
    "python-logging-loki (>=0.3.1,<0.4.0)",
    "prometheus-fastapi-instrumentator (==7.0.0)",
    "fastapi-cache2 (>=0.2.2,<0.3.0)",
    "arq (>=0.28.0,<0.29.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)",
    "boto3 (>=1.43.80,<2.0.0)",
    "pyotp (>=2.10.0,<3.0.0)"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.14.7,<0.15.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "testcontainers (>=4.15.0,<5.0.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)"
]
